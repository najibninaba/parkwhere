<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParkWhere architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,800&family=IBM+Plex+Mono:wght@500;600&family=Schibsted+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* ParkWhere skin for Diagram Design: paper, ink, bay-blue accent from src/index.css. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f0e5; --ink: #151412; --muted: #5c5850; --accent: #1f47c4; --link: #2f6f4f;
      --sans: 'Schibsted Grotesk', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; --display: 'Archivo', system-ui, sans-serif;
    }
    body { font-family: var(--sans); background: var(--paper); color: var(--ink); padding: 2.5rem 2rem; }
    .frame { max-width: 1000px; margin: 0 auto; }
    .eyebrow { font-family: var(--mono); font-size: 0.66rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--display); font-weight: 800; font-variation-settings: "wdth" 112; font-size: 1.9rem; letter-spacing: -0.02em; margin-bottom: 1.25rem; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · ParkWhere</p>
    <h1>How ParkWhere gets its data</h1>
    <div class="diagram-container">
      <svg id="diagram" viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">How ParkWhere gets its data</title>
        <desc id="architecture-desc">Public carpark feeds from data.gov.sg and LTA DataMall, bundled lists of HDB carparks and public carparks mapped on OpenStreetMap, and OneMap search, go through one Cloudflare Worker that keeps the last good counts in D1 and serves a JSON API to the ParkWhere web app, which hands directions to the driver's map app.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5c5850"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f47c4"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f6f4f"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f0e5"/>

        <!-- Zones -->
        <rect x="24" y="48" width="240" height="512" rx="8" fill="rgba(21,20,18,0.02)" stroke="rgba(21,20,18,0.12)" stroke-width="0.8"/>
        <rect x="88" y="52" width="112" height="12" rx="2" fill="#f5f0e5"/>
        <text x="144" y="61" fill="#5c5850" font-size="7" font-family="IBM Plex Mono, monospace" font-weight="600" text-anchor="middle" letter-spacing="0.14em">PUBLIC DATA</text>

        <rect x="340" y="48" width="280" height="512" rx="8" fill="rgba(21,20,18,0.02)" stroke="rgba(21,20,18,0.12)" stroke-width="0.8"/>
        <rect x="400" y="52" width="160" height="12" rx="2" fill="#f5f0e5"/>
        <text x="480" y="61" fill="#5c5850" font-size="7" font-family="IBM Plex Mono, monospace" font-weight="600" text-anchor="middle" letter-spacing="0.14em">CLOUDFLARE WORKER</text>

        <rect x="696" y="48" width="240" height="512" rx="8" fill="rgba(21,20,18,0.02)" stroke="rgba(21,20,18,0.12)" stroke-width="0.8"/>
        <rect x="776" y="52" width="80" height="12" rx="2" fill="#f5f0e5"/>
        <text x="816" y="61" fill="#5c5850" font-size="7" font-family="IBM Plex Mono, monospace" font-weight="600" text-anchor="middle" letter-spacing="0.14em">DRIVER</text>

        <!-- Arrows (drawn before nodes) -->
        <!-- data.gov.sg -> Worker (left edge, port y=248) -->
        <path d="M 244,152 H 292 Q 300,152 300,160 V 240 Q 300,248 308,248 H 380" fill="none" stroke="#2f6f4f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="314" y="188" width="56" height="12" rx="2" fill="#f5f0e5"/>
        <text x="342" y="197" fill="#5c5850" font-size="8" font-family="IBM Plex Mono, monospace" text-anchor="middle" letter-spacing="0.06em">EVERY MIN</text>
        <!-- LTA -> Worker (straight, y=272) -->
        <line x1="244" y1="272" x2="380" y2="272" stroke="#2f6f4f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="280" y="254" width="64" height="12" rx="2" fill="#f5f0e5"/>
        <text x="312" y="263" fill="#5c5850" font-size="8" font-family="IBM Plex Mono, monospace" text-anchor="middle" letter-spacing="0.06em">PAGED, KEY</text>
        <!-- OneMap -> Worker (port y=296) -->
        <path d="M 244,408 H 312 Q 320,408 320,400 V 304 Q 320,296 328,296 H 380" fill="none" stroke="#2f6f4f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="270" y="388" width="40" height="12" rx="2" fill="#f5f0e5"/>
        <text x="290" y="397" fill="#5c5850" font-size="8" font-family="IBM Plex Mono, monospace" text-anchor="middle" letter-spacing="0.06em">SEARCH</text>
        <!-- OneMap tiles -> app (browser loads directly), under the Worker zone -->
        <path d="M 144,440 V 512 Q 144,520 152,520 H 752 Q 760,520 760,512 V 324" fill="none" stroke="#5c5850" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="446" y="528" width="68" height="12" rx="2" fill="#f5f0e5"/>
        <text x="480" y="537" fill="#5c5850" font-size="8" font-family="IBM Plex Mono, monospace" text-anchor="middle" letter-spacing="0.06em">MAP TILES</text>
        <!-- Registry -> Worker (vertical) -->
        <line x1="480" y1="160" x2="480" y2="216" stroke="#5c5850" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="490" y="182" width="52" height="12" rx="2" fill="#f5f0e5"/>
        <text x="516" y="191" fill="#5c5850" font-size="8" font-family="IBM Plex Mono, monospace" text-anchor="middle" letter-spacing="0.06em">BUNDLED</text>
        <!-- Worker -> D1 (vertical) -->
        <line x1="468" y1="324" x2="468" y2="400" stroke="#5c5850" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="492" y1="400" x2="492" y2="328" stroke="#5c5850" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="502" y="352" width="72" height="12" rx="2" fill="#f5f0e5"/>
        <text x="538" y="361" fill="#5c5850" font-size="8" font-family="IBM Plex Mono, monospace" text-anchor="middle" letter-spacing="0.06em">LAST GOOD</text>
        <!-- Worker -> app (headline) -->
        <line x1="580" y1="272" x2="712" y2="272" stroke="#1f47c4" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
        <rect x="616" y="248" width="60" height="12" rx="2" fill="#f5f0e5"/>
        <text x="646" y="257" fill="#1f47c4" font-size="8" font-family="IBM Plex Mono, monospace" font-weight="600" text-anchor="middle" letter-spacing="0.06em">JSON API</text>
        <!-- app -> map apps (hand-off) -->
        <line x1="832" y1="220" x2="832" y2="164" stroke="#5c5850" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="842" y="186" width="64" height="12" rx="2" fill="#f5f0e5"/>
        <text x="874" y="195" fill="#5c5850" font-size="8" font-family="IBM Plex Mono, monospace" text-anchor="middle" letter-spacing="0.06em">DIRECTIONS</text>

        <!-- Nodes -->
        <!-- data.gov.sg -->
        <rect x="44" y="120" width="200" height="64" rx="6" fill="#f5f0e5"/>
        <rect x="44" y="120" width="200" height="64" rx="6" fill="#fffdf8" stroke="#2f6f4f" stroke-width="1"/>
        <rect x="52" y="126" width="36" height="12" rx="2" fill="transparent" stroke="rgba(47,111,79,0.45)" stroke-width="0.8"/>
        <text x="70" y="135" fill="#2f6f4f" font-size="7" font-family="IBM Plex Mono, monospace" font-weight="600" text-anchor="middle" letter-spacing="0.08em">FEED</text>
        <text x="144" y="158" fill="#151412" font-size="12" font-weight="600" font-family="Schibsted Grotesk, system-ui, sans-serif" text-anchor="middle">HDB availability</text>
        <text x="144" y="174" fill="#5c5850" font-size="9" font-family="IBM Plex Mono, monospace" text-anchor="middle">data.gov.sg · no key</text>
        <!-- LTA -->
        <rect x="44" y="240" width="200" height="64" rx="6" fill="#f5f0e5"/>
        <rect x="44" y="240" width="200" height="64" rx="6" fill="#fffdf8" stroke="#2f6f4f" stroke-width="1"/>
        <rect x="52" y="246" width="36" height="12" rx="2" fill="transparent" stroke="rgba(47,111,79,0.45)" stroke-width="0.8"/>
        <text x="70" y="255" fill="#2f6f4f" font-size="7" font-family="IBM Plex Mono, monospace" font-weight="600" text-anchor="middle" letter-spacing="0.08em">FEED</text>
        <text x="144" y="278" fill="#151412" font-size="12" font-weight="600" font-family="Schibsted Grotesk, system-ui, sans-serif" text-anchor="middle">Mall and URA carparks</text>
        <text x="144" y="294" fill="#5c5850" font-size="9" font-family="IBM Plex Mono, monospace" text-anchor="middle">LTA DataMall</text>
        <!-- OneMap -->
        <rect x="44" y="376" width="200" height="64" rx="6" fill="#f5f0e5"/>
        <rect x="44" y="376" width="200" height="64" rx="6" fill="#fffdf8" stroke="#2f6f4f" stroke-width="1"/>
        <rect x="52" y="382" width="36" height="12" rx="2" fill="transparent" stroke="rgba(47,111,79,0.45)" stroke-width="0.8"/>
        <text x="70" y="391" fill="#2f6f4f" font-size="7" font-family="IBM Plex Mono, monospace" font-weight="600" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="144" y="414" fill="#151412" font-size="12" font-weight="600" font-family="Schibsted Grotesk, system-ui, sans-serif" text-anchor="middle">OneMap</text>
        <text x="144" y="430" fill="#5c5850" font-size="9" font-family="IBM Plex Mono, monospace" text-anchor="middle">SLA · search, tiles</text>
        <!-- Registry -->
        <rect x="380" y="96" width="200" height="64" rx="6" fill="#f5f0e5"/>
        <rect x="380" y="96" width="200" height="64" rx="6" fill="#fffdf8" stroke="#151412" stroke-width="1"/>
        <rect x="388" y="102" width="36" height="12" rx="2" fill="transparent" stroke="rgba(21,20,18,0.35)" stroke-width="0.8"/>
        <text x="406" y="111" fill="#5c5850" font-size="7" font-family="IBM Plex Mono, monospace" font-weight="600" text-anchor="middle" letter-spacing="0.08em">DATA</text>
        <text x="480" y="134" fill="#151412" font-size="12" font-weight="600" font-family="Schibsted Grotesk, system-ui, sans-serif" text-anchor="middle">Bundled carpark lists</text>
        <text x="480" y="150" fill="#5c5850" font-size="9" font-family="IBM Plex Mono, monospace" text-anchor="middle">HDB · OpenStreetMap</text>
        <!-- Worker (focal) -->
        <rect x="380" y="220" width="200" height="104" rx="6" fill="#f5f0e5"/>
        <rect x="380" y="220" width="200" height="104" rx="6" fill="#e6ebf7" stroke="#1f47c4" stroke-width="1.4"/>
        <rect x="388" y="226" width="48" height="12" rx="2" fill="transparent" stroke="rgba(31,71,196,0.5)" stroke-width="0.8"/>
        <text x="412" y="235" fill="#1f47c4" font-size="7" font-family="IBM Plex Mono, monospace" font-weight="600" text-anchor="middle" letter-spacing="0.08em">WORKER</text>
        <text x="480" y="266" fill="#151412" font-size="13" font-weight="600" font-family="Schibsted Grotesk, system-ui, sans-serif" text-anchor="middle">parkwhere</text>
        <text x="480" y="284" fill="#5c5850" font-size="9" font-family="IBM Plex Mono, monospace" text-anchor="middle">Effect fetch, retry, decode</text>
        <text x="480" y="298" fill="#5c5850" font-size="9" font-family="IBM Plex Mono, monospace" text-anchor="middle">/api/nearby /api/overview</text>
        <text x="480" y="312" fill="#5c5850" font-size="9" font-family="IBM Plex Mono, monospace" text-anchor="middle">/api/search /health</text>
        <!-- D1 -->
        <rect x="380" y="400" width="200" height="64" rx="6" fill="#f5f0e5"/>
        <rect x="380" y="400" width="200" height="64" rx="6" fill="#fffdf8" stroke="#151412" stroke-width="1"/>
        <rect x="388" y="406" width="36" height="12" rx="2" fill="transparent" stroke="rgba(21,20,18,0.35)" stroke-width="0.8"/>
        <text x="406" y="415" fill="#5c5850" font-size="7" font-family="IBM Plex Mono, monospace" font-weight="600" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="480" y="438" fill="#151412" font-size="12" font-weight="600" font-family="Schibsted Grotesk, system-ui, sans-serif" text-anchor="middle">D1 snapshots</text>
        <text x="480" y="454" fill="#5c5850" font-size="9" font-family="IBM Plex Mono, monospace" text-anchor="middle">one per source, plus status</text>
        <!-- Map apps -->
        <rect x="716" y="100" width="200" height="64" rx="6" fill="#f5f0e5"/>
        <rect x="716" y="100" width="200" height="64" rx="6" fill="#fffdf8" stroke="#151412" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="724" y="106" width="36" height="12" rx="2" fill="transparent" stroke="rgba(21,20,18,0.35)" stroke-width="0.8"/>
        <text x="742" y="115" fill="#5c5850" font-size="7" font-family="IBM Plex Mono, monospace" font-weight="600" text-anchor="middle" letter-spacing="0.08em">APPS</text>
        <text x="816" y="138" fill="#151412" font-size="12" font-weight="600" font-family="Schibsted Grotesk, system-ui, sans-serif" text-anchor="middle">Your map app</text>
        <text x="816" y="154" fill="#5c5850" font-size="9" font-family="IBM Plex Mono, monospace" text-anchor="middle">Google Maps · Apple Maps · Waze</text>
        <!-- App -->
        <rect x="716" y="220" width="200" height="104" rx="6" fill="#f5f0e5"/>
        <rect x="716" y="220" width="200" height="104" rx="6" fill="#fffdf8" stroke="#151412" stroke-width="1"/>
        <rect x="724" y="226" width="28" height="12" rx="2" fill="transparent" stroke="rgba(21,20,18,0.35)" stroke-width="0.8"/>
        <text x="738" y="235" fill="#5c5850" font-size="7" font-family="IBM Plex Mono, monospace" font-weight="600" text-anchor="middle" letter-spacing="0.08em">PWA</text>
        <text x="816" y="266" fill="#151412" font-size="13" font-weight="600" font-family="Schibsted Grotesk, system-ui, sans-serif" text-anchor="middle">ParkWhere app</text>
        <text x="816" y="284" fill="#5c5850" font-size="9" font-family="IBM Plex Mono, monospace" text-anchor="middle">React, Leaflet map</text>
        <text x="816" y="298" fill="#5c5850" font-size="9" font-family="IBM Plex Mono, monospace" text-anchor="middle">prices from HDB rules</text>
        <text x="816" y="312" fill="#5c5850" font-size="9" font-family="IBM Plex Mono, monospace" text-anchor="middle">shared/tariff.ts</text>

        <!-- Legend -->
        <line x1="24" y1="584" x2="936" y2="584" stroke="rgba(21,20,18,0.12)" stroke-width="0.8"/>
        <text x="24" y="608" fill="#5c5850" font-size="8" font-family="IBM Plex Mono, monospace" font-weight="600" letter-spacing="0.14em">LEGEND</text>
        <line x1="100" y1="605" x2="132" y2="605" stroke="#2f6f4f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="140" y="608" fill="#151412" font-size="9" font-family="Schibsted Grotesk, system-ui, sans-serif">External data the Worker fetches</text>
        <line x1="330" y1="605" x2="362" y2="605" stroke="#1f47c4" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
        <text x="370" y="608" fill="#151412" font-size="9" font-family="Schibsted Grotesk, system-ui, sans-serif">What the app calls</text>
        <line x1="500" y1="605" x2="532" y2="605" stroke="#5c5850" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="540" y="608" fill="#151412" font-size="9" font-family="Schibsted Grotesk, system-ui, sans-serif">Loaded or opened directly by the browser</text>
      </svg>
    </div>
  </div>
</body>
</html>
