name: Deploy

# Every push to main goes to staging first. Production is deployed only if staging's smoke checks pass.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# Queue deploys rather than cancelling one half-way through.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    name: Check
    # A manual run can pick any branch; only main may deploy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck app and Worker
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  staging:
    name: Deploy staging
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://parkwhere-staging.bijan.app
    env:
      URL: https://parkwhere-staging.bijan.app
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for staging
        run: pnpm build:staging

      # D1 migrations are not applied here; the CI token has no D1 permission. Apply them first with
      # `pnpm exec wrangler d1 migrations apply parkwhere-staging --remote --env staging`.
      - name: Deploy staging Worker
        # The token is given to this step only, not to install, build or the phone check.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Smoke-test staging
        run: |
          set -euo pipefail
          for _ in $(seq 1 15); do
            code=$(curl -s -o nearby.json -w '%{http_code}' "$URL/api/nearby?lat=1.30106&lng=103.85412") || true
            [ "$code" = "200" ] && break
            sleep 4
          done
          python3 -c "import json; d=json.load(open('nearby.json')); assert d['carparks'], 'no carparks'; print('feed:', d['feed']['state'], '| carparks:', len(d['carparks']))"
          echo "health: $(curl -s -o /dev/null -w '%{http_code}' "$URL/health") (advisory: depends on data.gov.sg)"

      - name: Check phones on staging
        run: pnpm check:mobile "$URL"

  production:
    name: Deploy production
    needs: staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://parkwhere.bijan.app
    env:
      URL: https://parkwhere.bijan.app
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for production
        run: pnpm build

      # Apply production migrations first with `pnpm exec wrangler d1 migrations apply parkwhere-production --remote`.
      - name: Deploy production Worker
        # The token is given to this step only, not to install, build or the phone check.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Smoke-test production
        run: |
          set -euo pipefail
          for _ in $(seq 1 15); do
            code=$(curl -s -o nearby.json -w '%{http_code}' "$URL/api/nearby?lat=1.30106&lng=103.85412") || true
            [ "$code" = "200" ] && break
            sleep 4
          done
          python3 -c "import json; d=json.load(open('nearby.json')); assert d['carparks'], 'no carparks'; print('feed:', d['feed']['state'], '| carparks:', len(d['carparks']))"
          echo "health: $(curl -s -o /dev/null -w '%{http_code}' "$URL/health") (advisory: depends on data.gov.sg)"

      - name: Check phones on production
        run: pnpm check:mobile "$URL"
