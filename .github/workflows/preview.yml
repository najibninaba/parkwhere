name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck app and Worker
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build for staging
        run: pnpm build:staging

      # The preview job deploys with a fixed config; keep its compatibility date in step with wrangler.jsonc.
      - name: Preview config matches wrangler.jsonc
        run: |
          grep -q '"compatibility_date": "2026-10-01"' wrangler.jsonc || { echo "::error::Update compatibility_date in .github/workflows/preview.yml to match wrangler.jsonc"; exit 1; }

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist
          retention-days: 3
          if-no-files-found: error

  # This job holds the Cloudflare token, so it never checks out or runs code from the pull request.
  # It uploads the files the check job built as a preview version of the staging Worker, which has its
  # own D1 database. Pull requests from forks get no secrets and no preview.
  preview:
    name: Deploy preview
    needs: check
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.alias.outputs.url }}
    outputs:
      url: ${{ steps.alias.outputs.url }}
    steps:
      - name: Require Cloudflare credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see README, "One-time setup: GitHub secrets for Cloudflare")."
            exit 1
          fi

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: build
          path: dist

      # The Wrangler config generated by the build comes from the pull request, and fields such as
      # build.command or unsafe.metadata would run commands or rebind the Worker while the token is
      # present. So it is never used: this step writes the deploy config from fixed values and keeps
      # only the built JavaScript and static files from the artifact.
      - name: Write a trusted staging config
        run: |
          set -euo pipefail
          test -f dist/parkwhere/index.js
          test -d dist/client
          # Nothing but the bundle and its source map may sit beside the config.
          extra=$(find dist/parkwhere -type f ! -name index.js ! -name index.js.map ! -name wrangler.json ! -name '*.webmanifest' ! -name registerSW.js | head -5)
          if [ -n "$extra" ]; then echo "::error::Unexpected files in the Worker build: $extra"; exit 1; fi
          rm -f dist/parkwhere/wrangler.json
          cat > dist/parkwhere/trusted.wrangler.json <<'JSON'
          {
            "name": "parkwhere-staging",
            "main": "index.js",
            "no_bundle": true,
            "compatibility_date": "2026-10-01",
            "rules": [{ "type": "ESModule", "globs": ["**/*.js"] }],
            "assets": {
              "directory": "../client",
              "binding": "ASSETS",
              "not_found_handling": "single-page-application",
              "run_worker_first": ["/api/*", "/health"]
            },
            "d1_databases": [{ "binding": "DB", "database_name": "parkwhere-staging", "database_id": "3ddd46d4-f766-4927-8369-1c34d67dbf9d" }],
            "ratelimits": [{ "name": "SEARCH_LIMITER", "namespace_id": "4202", "simple": { "limit": 30, "period": 60 } }],
            "workers_dev": true,
            "preview_urls": true,
            "observability": { "enabled": true }
          }
          JSON

      # One alias per pull request, so two branches never share a preview URL.
      - name: Upload preview version
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.151.1
          command: >-
            versions upload --config dist/parkwhere/trusted.wrangler.json
            --preview-alias pr-${{ github.event.pull_request.number }}
            --message "PR ${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}"

      - name: Preview URL
        id: alias
        run: echo "url=https://pr-${{ github.event.pull_request.number }}-parkwhere-staging.najibninaba.workers.dev" >> "$GITHUB_OUTPUT"

  # Captures screenshots, a walkthrough and checks from the preview using the pull request's own code,
  # so a PR that changes the UI or the capture script is checked by its own version. It gets no secrets
  # and read-only permissions, and hands its results on as an artifact.
  capture:
    name: Capture proof
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ steps.capture.outputs.status }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright's video encoder
        run: pnpm exec playwright-core install ffmpeg

      - name: Wait for the preview
        env:
          URL: ${{ needs.preview.outputs.url }}
        run: |
          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL/")" = "200" ]; then exit 0; fi
            sleep 4
          done
          echo "::error::$URL did not come up"
          exit 1

      - name: Capture screenshots, walkthrough and checks
        id: capture
        env:
          URL: ${{ needs.preview.outputs.url }}
        run: |
          set +e
          node scripts/pr-proof.ts "$URL" proof
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Make a GIF of the walkthrough
        if: hashFiles('proof/walkthrough.webm') != ''
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -loglevel error -y -i proof/walkthrough.webm \
            -vf "fps=8,scale=320:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=96[p];[s1][p]paletteuse=dither=bayer" \
            proof/walkthrough.gif

      - name: Upload the proof
        uses: actions/upload-artifact@v7
        with:
          name: proof
          path: proof
          retention-days: 14
          if-no-files-found: ignore

  # Publishes the proof and writes the preview link and proof into the pull request description.
  # It can write to the repository, so it runs no repository code: it only copies known file names
  # from the capture artifact and treats summary.md as text.
  publish:
    name: Publish proof
    needs: [preview, capture]
    if: ${{ !cancelled() && needs.preview.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download the proof
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: proof
          path: proof

      - name: Publish proof to the pr-proof branch
        id: publish
        if: hashFiles('proof/*.png') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: pr-${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir publish && cd publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin pr-proof; then git checkout -q -b pr-proof FETCH_HEAD; else git checkout -q --orphan pr-proof; fi
          # Keep only the latest proof per pull request, and only images (videos stay in the artifact).
          rm -rf "$PR"
          mkdir -p "$PR/$SHA"
          for name in 01-start-phone.png 02-results-phone.png 03-card-rates-phone.png 04-card-directions-phone.png 05-results-desktop.png walkthrough.gif; do
            if [ -f "../proof/$name" ]; then cp "../proof/$name" "$PR/$SHA/"; fi
          done
          git add -A
          git commit -q -m "Proof for $PR at $SHA" || true
          pushed=false
          for _ in 1 2 3; do
            if git push -q origin pr-proof; then pushed=true; break; fi
            git fetch -q origin pr-proof && git rebase -q FETCH_HEAD || true
          done
          if [ "$pushed" != true ]; then echo "::error::Couldn't publish proof to the pr-proof branch."; exit 1; fi
          echo "dir=$PR/$SHA" >> "$GITHUB_OUTPUT"

      - name: Show preview and proof in the description
        if: ${{ !cancelled() }}
        uses: actions/github-script@v8
        env:
          URL: ${{ needs.preview.outputs.url }}
          DIR: ${{ steps.publish.outputs.dir }}
          STATUS: ${{ needs.capture.outputs.status }}
        with:
          script: |
            const fs = require("fs");
            const start = "<!-- parkwhere-preview:start -->";
            const end = "<!-- parkwhere-preview:end -->";
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const dir = process.env.DIR;
            const file = (name) => `https://github.com/${owner}/${repo}/blob/pr-proof/${dir}/${name}?raw=true`;
            const has = (name) => Boolean(dir) && fs.existsSync(`proof/${name}`);
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const status = process.env.STATUS === "0" ? "✅ all checks passed" : process.env.STATUS ? "❌ a check failed, see the table" : "⚠️ capture didn't run, see the workflow";
            const lines = [
              start,
              "## Preview and proof",
              "",
              `**Preview:** ${process.env.URL} · commit \`${sha}\` · staging data; production is untouched until merge`,
              `**Proof:** ${status} · [workflow run, video and downloads](${run})`,
            ];
            // Embed only what was actually captured; a failed run may stop part-way.
            const shots = [["02-results-phone.png", "Phone"], ["03-card-rates-phone.png", "Rates"], ["04-card-directions-phone.png", "Directions"]].filter(([name]) => has(name));
            if (shots.length) {
              lines.push("", `| ${shots.map(([, label]) => label).join(" | ")} |`, `|${shots.map(() => "---").join("|")}|`);
              lines.push(`| ${shots.map(([name]) => `<img src="${file(name)}" width="240">`).join(" | ")} |`);
            }
            if (has("walkthrough.gif")) lines.push("", `<details><summary>Walkthrough (phone)</summary><img src="${file("walkthrough.gif")}" width="320"></details>`);
            if (has("05-results-desktop.png")) lines.push("", `<details><summary>Desktop</summary><img src="${file("05-results-desktop.png")}" width="720"></details>`);
            if (fs.existsSync("proof/summary.md")) lines.push("", fs.readFileSync("proof/summary.md", "utf8").slice(0, 4000).trim());
            lines.push(end);
            const section = lines.join("\n");
            // Read the description now rather than from the event, so edits made since the push survive.
            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number });
            const current = pull.body ?? "";
            const from = current.indexOf(start);
            const to = current.indexOf(end);
            const rest = from !== -1 && to > from
              ? current.slice(0, from) + current.slice(to + end.length).replace(/^(?:\r?\n)+/, "")
              : current;
            await github.rest.pulls.update({ owner, repo, pull_number, body: rest ? `${section}\n\n${rest}` : section });

      - name: Fail if the proof checks failed
        if: ${{ !cancelled() && needs.capture.outputs.status != '0' }}
        env:
          STATUS: ${{ needs.capture.outputs.status }}
        run: |
          echo "::error::Proof checks failed against the preview (status: ${STATUS:-not run}). See the PR description."
          exit 1
